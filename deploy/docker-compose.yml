services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: b2b
      POSTGRES_PASSWORD: b2b
      POSTGRES_DB: b2b
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2b -d b2b"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - b2b-postgres:/var/lib/postgresql/data

volumes:
  b2b-postgres:
